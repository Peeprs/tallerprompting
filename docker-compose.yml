services:
  mysql:
    image: mysql:8.0
    container_name: transporte-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: transporteDb
      MYSQL_USER: transporteApp
      MYSQL_PASSWORD: 2tAq2P1D+OwLNZlRld2Wi7TtdXyKqd3N
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u transporteApp -p2tAq2P1D+OwLNZlRld2Wi7TtdXyKqd3N || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  mysql_data:
